name: Cleanup merged branches

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/cleanup-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Remover branches ja incorporadas
        run: |
          git push origin --delete feat/gabriel-sys-v2 fix/navigation-clarity
